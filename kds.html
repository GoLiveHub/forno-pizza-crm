<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кухонний дисплей - Forno</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E1251B'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='Georgia'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;1,400&family=Fraunces:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/kds.css?v=1">
<link rel="stylesheet" href="css/polish.css?v=1">
</head>
<body class="kds-body">
<div class="kds-top">
  <div class="kds-top__brand">Forno <span>KDS</span></div>
  <div class="kds-top__info" id="kdsInfo">…</div>
  <div class="kds-top__actions">
    <button class="kds-btn" id="kdsBeep" type="button">Звук</button>
    <a class="kds-btn" href="app.html">До CRM</a>
    <button class="kds-btn" id="kdsLogout" type="button">Вийти</button>
  </div>
</div>

<div class="kds-flash" id="kdsFlash">Нове замовлення!</div>

<main class="kds-board" id="kdsBoard">
  <section class="kds-col kds-col--cooking">
    <h2>Готується <span class="kds-count" id="countCooking">0</span></h2>
    <div id="colCooking"></div>
  </section>
  <section class="kds-col kds-col--new">
    <h2>На кухні <span class="kds-count" id="countNew">0</span></h2>
    <div id="colNew"></div>
  </section>
  <section class="kds-col kds-col--done">
    <h2>Готово до видачі <span class="kds-count" id="countDone">0</span></h2>
    <div id="colDone"></div>
  </section>
</main>

<div class="kds-blocked" id="kdsBlocked" hidden>
  <div class="kds-blocked__box">
    <h1>Доступ заборонено</h1>
    <p>Кухонний дисплей доступний лише для ролі «Повар» або адміністратора.</p>
    <a href="login.html">Перейти до входу</a>
  </div>
</div>

<script src="js/i18n.js?v=10"></script>
<script src="js/api.js?v=1"></script>
<script src="js/kds.js?v=1"></script>
</body>
</html>
